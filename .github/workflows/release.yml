name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux Packages (.deb & .rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev \
            libinput-dev \
            libgtk-3-dev \
            libxdo-dev \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install packaging utilities
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release

      - name: Package Debian (.deb)
        run: |
          cargo deb --no-build
          mkdir -p dist
          cp target/debian/*.deb dist/

      - name: Package Red Hat (.rpm)
        run: |
          cargo generate-rpm --output dist/
          ls -la dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Windows Executables & Package
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare Windows distribution artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          New-Item -ItemType Directory -Force -Path dist/bundle

          # Check candidate binary locations
          $candidates = @(
            "target/x86_64-pc-windows-msvc/release/gesture-manager.exe",
            "target/release/gesture-manager.exe"
          )

          $binPath = $null
          foreach ($p in $candidates) {
            if (Test-Path $p) {
              $binPath = $p
              break
            }
          }

          if (-not $binPath) {
            Write-Error "Could not find compiled gesture-manager.exe in target directories!"
            exit 1
          }

          Write-Host "Found compiled executable at: $binPath"

          # 1. Standalone .exe copies
          Copy-Item $binPath "dist/gesture-manager.exe"
          Copy-Item $binPath "dist/gesture-manager-windows-x86_64.exe"

          # 2. Bundle files for portable zip distribution
          Copy-Item $binPath "dist/bundle/gesture-manager.exe"
          if (Test-Path "README.md") {
            Copy-Item "README.md" "dist/bundle/"
          }

          # Create run and autostart batch helpers
          Set-Content -Path "dist/bundle/start-gesture-manager.bat" -Value "@echo off`r`nstart """" ""%~dp0gesture-manager.exe"""
          Set-Content -Path "dist/bundle/add-to-startup.bat" -Value "@echo off`r`npowershell -Command ""`$s=(New-Object -COM WScript.Shell).CreateShortcut('`$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\gesture-manager.lnk');`$s.TargetPath='%~dp0gesture-manager.exe';`$s.Save()""`r`necho Added Touchpad Gesture Manager to Windows Startup."
          Set-Content -Path "dist/bundle/remove-from-startup.bat" -Value "@echo off`r`ndel /f /q ""%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\gesture-manager.lnk""`r`necho Removed Touchpad Gesture Manager from Windows Startup."

          # Generate sample config in bundle
          & "dist/gesture-manager.exe" --no-tray --check-config

          # Create zip archive
          Compress-Archive -Path dist/bundle/* -DestinationPath dist/gesture-manager-windows-x86_64.zip -Force

          # Clean up temporary bundle directory
          Remove-Item -Recurse -Force dist/bundle

          Write-Host "Prepared Windows artifacts:"
          Get-ChildItem dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release-files
          # Flatten all artifacts into release-files regardless of download subfolder layout
          find artifacts -type f -exec cp -v {} release-files/ \;
          echo "=== Files staged for GitHub Release ==="
          ls -la release-files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
