name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux Packages (.deb & .rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev \
            libinput-dev \
            libgtk-3-dev \
            libxdo-dev \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install packaging utilities
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release

      - name: Package Debian (.deb)
        run: |
          cargo deb --no-build
          mkdir -p dist
          cp target/debian/*.deb dist/

      - name: Package Red Hat (.rpm)
        run: |
          cargo generate-rpm --output dist/
          ls -la dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  build-windows:
    name: Windows Executable (.exe & archive)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare Windows distribution bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/x86_64-pc-windows-msvc/release/gesture-manager.exe dist/
          
          # Generate sample configuration alongside binary
          ./dist/gesture-manager.exe --no-tray --check-config
          
          # Bundle portable release archive
          Compress-Archive -Path dist/gesture-manager.exe -DestinationPath dist/gesture-manager-windows-x86_64.zip
          
          # Keep standalone .exe for direct release attachment
          Copy-Item dist/gesture-manager.exe dist/gesture-manager-setup.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/gesture-manager.exe
            dist/gesture-manager-windows-x86_64.zip

  publish-release:
    name: GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded release assets
        run: ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.exe
            release-assets/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
